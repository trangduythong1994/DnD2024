<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      name="description"
      content="D&D 2024 Character Sheet. Fast, local-first character tracking."
    />
    <title>Character Sheet · D&D 2024</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css?v=6" />
  </head>
  <body>
    <a class="skip" href="#sheet">Skip to character sheet</a>
    <main id="sheet">
      <section class="identity" aria-label="Character details">
        <div class="name-block">
          <label class="sr-only" for="character-name">Character name</label>
          <input
            id="character-name"
            data-path="name"
            placeholder="Unnamed character"
            maxlength="200"
          />
          <button id="new" class="new-character" aria-label="New character">
            ＋ New
          </button>
        </div>
      </section>
      <div class="notice" id="review-notice" hidden></div>
      <nav class="mobile-panel-switch" aria-label="Sheet panels">
        <button id="show-character" aria-pressed="true">Character</button>
        <button id="show-gear" aria-pressed="false">Gear</button>
      </nav>
      <div class="workspace" data-mobile-panel="character">
        <section class="sheet-panel" aria-label="Character">
          <label class="mobile-tab-picker">
            <span class="sr-only">Character section</span>
            <select id="left-mobile-tabs" aria-label="Character section"></select>
          </label>
          <nav
            class="tabs"
            id="left-tabs"
            role="tablist"
            aria-label="Character tabs"
          ></nav>
          <div id="left-content" role="tabpanel"></div>
        </section>
        <section class="sheet-panel" aria-label="Adventuring gear">
          <label class="mobile-tab-picker">
            <span class="sr-only">Gear section</span>
            <select id="right-mobile-tabs" aria-label="Gear section"></select>
          </label>
          <nav
            class="tabs"
            id="right-tabs"
            role="tablist"
            aria-label="Gear tabs"
          ></nav>
          <div id="right-content" role="tabpanel"></div>
        </section>
      </div>
      <div id="reference-backdrop" class="reference-backdrop" hidden>
        <aside
          id="reference"
          class="reference"
          role="dialog"
          aria-modal="true"
          aria-label="Reference"
        >
          <div class="section-head">
            <span class="eyebrow">REFERENCE</span
            ><button id="close-reference" aria-label="Close reference">×</button>
          </div>
          <div id="reference-content"></div>
        </aside>
      </div>
      <footer>
        <span
          >Your data is stored in this browser and does not sync
          automatically.</span
        ><button id="about" class="text-button">Rules & guide ↗</button>
      </footer>
    </main>
    <dialog id="picker" aria-labelledby="picker-title">
      <div class="dialog-head">
        <div>
          <span class="eyebrow">2024 LIBRARY</span>
          <h2 id="picker-title">Choose an entry</h2>
        </div>
        <button id="close-picker" aria-label="Close dialog">×</button>
      </div>
      <p class="muted">
        SRD 5.2.1 subset · Preview before adding, or create your own entry.
      </p>
      <div class="picker-mode">
        <button id="library-mode" aria-pressed="true">Library</button
        ><button id="custom-mode" aria-pressed="false">＋ Create / edit</button>
      </div>
      <div id="library-view">
        <label
          >Search by name<input
            id="search"
            type="search"
            placeholder="Search the library…"
        /></label>
        <div class="picker-columns">
          <div id="results"></div>
          <section id="preview" aria-label="Preview">
            <p class="muted">Choose an entry to view its details.</p>
          </section>
        </div>
      </div>
      <form id="custom-form" hidden>
        <div id="custom-fields"></div>
        <div class="dialog-actions">
          <button type="submit" class="primary">Save entry</button>
        </div>
      </form>
    </dialog>
    <dialog id="confirm-dialog" aria-labelledby="confirm-title">
      <h2 id="confirm-title">Confirm change</h2>
      <p id="confirm-message"></p>
      <div class="dialog-actions">
        <button id="cancel-confirm">Cancel, keep current data</button
        ><button id="accept-confirm" class="primary">Confirm</button>
      </div>
    </dialog>
    <div id="toast" role="status" hidden></div>
    <script type="module" src="./app.js?v=8"></script>
  </body>
</html>
